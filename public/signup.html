<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2" />
<title>新規登録 - 電子お薬手帳</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2C4A52" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a href="index.html" class="auth-back" aria-label="表紙に戻る">←</a>
      <h1 class="auth-title">はじめまして</h1>
      <p class="text-muted">まずは、あなたのことを教えてください。</p>

      <form id="signup-form" class="stack" novalidate>
        <!-- フォーム全体のお知らせ（スクリーンリーダーにも通知される） -->
        <div id="form-error" class="form-error" role="alert" tabindex="-1" hidden>
          <span class="form-error__icon" aria-hidden="true">!</span>
          <p class="form-error__title" id="form-error-title"></p>
          <p class="form-error__text" id="form-error-text"></p>
          <div class="form-error__actions" id="form-error-actions" hidden></div>
        </div>

        <fieldset class="role-select">
          <legend class="visually-hidden">どちらで使いますか</legend>
          <label class="role-option">
            <input type="radio" name="role" value="patient" checked />
            <span class="role-card">
              <strong>お薬を飲む本人として</strong>
              <span class="text-sm text-muted">服薬の記録をつけます</span>
            </span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="caregiver" />
            <span class="role-card">
              <strong>家族・介護者として</strong>
              <span class="text-sm text-muted">大切な人の服薬を見守ります</span>
            </span>
          </label>
        </fieldset>

        <div class="field">
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" autocomplete="name"
                 required maxlength="50" placeholder="山田 太郎"
                 aria-describedby="name-error" />
          <span class="field-error" id="name-error" hidden></span>
        </div>

        <div class="field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" autocomplete="email"
                 required placeholder="example@mail.com"
                 aria-describedby="email-error" />
          <span class="field-error" id="email-error" hidden></span>
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password"
                   required minlength="8" maxlength="72" placeholder="8文字以上"
                   aria-describedby="password-hint password-error" />
            <button type="button" class="password-toggle" id="password-toggle"
                    aria-label="パスワードを表示" aria-pressed="false">表示</button>
          </div>
          <span class="field-hint" id="password-hint">8文字以上で設定してください。</span>
          <span class="field-error" id="password-error" hidden></span>
        </div>

        <button type="submit" class="btn btn-accent" id="submit-btn">登録する</button>
      </form>

      <p class="auth-switch">すでにアカウントをお持ちの方は <a href="login.html">ログイン</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (() => {
      'use strict';

      const form = document.getElementById('signup-form');
      const submitBtn = document.getElementById('submit-btn');
      const passwordInput = document.getElementById('password');
      const passwordToggle = document.getElementById('password-toggle');

      const formError = document.getElementById('form-error');
      const formErrorTitle = document.getElementById('form-error-title');
      const formErrorText = document.getElementById('form-error-text');
      const formErrorActions = document.getElementById('form-error-actions');

      // ---- パスワード表示切り替え ----
      passwordToggle.addEventListener('click', () => {
        const isHidden = passwordInput.type === 'password';
        passwordInput.type = isHidden ? 'text' : 'password';
        passwordToggle.textContent = isHidden ? '隠す' : '表示';
        passwordToggle.setAttribute('aria-label', isHidden ? 'パスワードを隠す' : 'パスワードを表示');
        passwordToggle.setAttribute('aria-pressed', String(isHidden));
        passwordInput.focus();
      });

      // ---- エラー表示ユーティリティ ----
      function setFieldError(fieldName, message) {
        const input = form.elements[fieldName];
        const errorEl = document.getElementById(`${fieldName}-error`);
        if (!errorEl) return;
        if (message) {
          errorEl.textContent = message;
          errorEl.hidden = false;
          input?.setAttribute('aria-invalid', 'true');
        } else {
          errorEl.textContent = '';
          errorEl.hidden = true;
          input?.removeAttribute('aria-invalid');
        }
      }

      // 見出し・説明・（あれば）次の行き先ボタン、の3点セットで出す。
      // 「何が起きたか」と「どうすればよいか」を分けて置くのが要点。
      function showFormError({ title, text, action }) {
        formErrorTitle.textContent = title;
        formErrorText.textContent = text;

        formErrorActions.replaceChildren();
        if (action) {
          const link = document.createElement('a');
          link.className = 'error-action';
          link.href = action.href;
          link.textContent = action.label;
          formErrorActions.appendChild(link);
          formErrorActions.hidden = false;
        } else {
          formErrorActions.hidden = true;
        }

        formError.hidden = false;
        formError.scrollIntoView({ block: 'center', behavior: 'smooth' });
        formError.focus();
      }

      function clearAllErrors() {
        ['name', 'email', 'password'].forEach((f) => setFieldError(f, null));
        formError.hidden = true;
        formErrorTitle.textContent = '';
        formErrorText.textContent = '';
        formErrorActions.replaceChildren();
        formErrorActions.hidden = true;
      }

      // サーバー／通信のエラーを、そのまま読んで意味の通る日本語に置き換える。
      // 判断材料は err.code（サーバーが付ける識別子）と HTTP ステータス。
      function toFriendlyMessage(err) {
        const code = err?.code;
        const status = err?.status;

        if (code === 'EMAIL_ALREADY_REGISTERED') {
          return {
            title: 'このメールアドレスは、すでに登録されています',
            text: '以前に、このメールアドレスでアカウントをお作りになっています。'
                + '新しく登録しなくても、そのままログインしてお使いいただけます。',
            action: { label: 'ログインの画面へ進む', href: 'login.html' },
            focusField: 'email',
            fieldMessage: 'すでに登録されているメールアドレスです。',
          };
        }

        if (code === 'NETWORK_ERROR') {
          return {
            title: 'インターネットにつながりませんでした',
            text: 'お手数ですが、Wi-Fiや電波の状態をお確かめのうえ、'
                + 'もう一度「登録する」を押してください。',
          };
        }

        if (code === 'RATE_LIMITED' || status === 429) {
          return {
            title: '少し時間をおいてからお試しください',
            text: '短い間に何度も登録をお試しになったため、'
                + 'ただいま受け付けできません。5分ほどたってから、もう一度お願いします。',
          };
        }

        if (code === 'VALIDATION_ERROR') {
          return {
            title: '入力の内容をご確認ください',
            text: err.message,
            focusField: err.field,
            fieldMessage: err.message,
          };
        }

        if (typeof status === 'number' && status >= 500) {
          return {
            title: 'ただいま登録の受け付けができません',
            text: 'こちらの不具合の可能性があります。'
                + '恐れ入りますが、しばらくたってからもう一度お試しください。',
          };
        }

        return {
          title: '登録できませんでした',
          text: err?.message || '恐れ入りますが、もう一度お試しください。',
        };
      }

      // 入力を直したらそのフィールドのエラーを消す
      ['name', 'email', 'password'].forEach((f) => {
        form.elements[f].addEventListener('input', () => setFieldError(f, null));
      });

      // ---- 送信 ----
      let submitting = false;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (submitting) return;

        clearAllErrors();

        const fd = new FormData(form);
        const payload = {
          name: (fd.get('name') ?? '').trim(),
          email: (fd.get('email') ?? '').trim(),
          password: fd.get('password') ?? '',
          role: fd.get('role') ?? '',
        };

        // ---- 送信前の検証 ----
        const errors = {
          name: Validate.name(payload.name),
          email: Validate.email(payload.email),
          password: Validate.password(payload.password),
        };
        const roleError = Validate.role(payload.role);

        let firstInvalid = null;
        for (const [field, message] of Object.entries(errors)) {
          if (message) {
            setFieldError(field, message);
            firstInvalid = firstInvalid || form.elements[field];
          }
        }
        if (roleError) {
          showFormError({ title: '入力の内容をご確認ください', text: roleError });
        }
        if (firstInvalid || roleError) {
          firstInvalid?.focus();
          return;
        }

        // ---- 送信実行 ----
        submitting = true;
        submitBtn.disabled = true;
        submitBtn.textContent = '登録しています…';

        try {
          const result = await Api.signup(payload);

          if (result.session) {
            // メール確認OFFの設定なら即ログイン状態にする
            Session.set(result.session, result.user, null);
            showToast('登録が完了しました。', 'success');
            setTimeout(() => (location.href = 'home.html'), 600);
          } else {
            showToast('登録が完了しました。確認メールをご確認のうえログインしてください。', 'success');
            setTimeout(() => (location.href = 'login.html'), 1200);
          }
          // 遷移するのでボタンは戻さない
        } catch (err) {
          // トーストは数秒で消えてしまうため、失敗時は画面に残る表示のみにする
          const info = toFriendlyMessage(err);
          if (info.focusField && info.fieldMessage) {
            setFieldError(info.focusField, info.fieldMessage);
          }
          showFormError(info);

          submitting = false;
          submitBtn.disabled = false;
          submitBtn.textContent = '登録する';
        }
      });
    })();
  </script>
</body>
</html>
