<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2" />
<title>新規登録 - 電子お薬手帳</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2C4A52" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a href="index.html" class="auth-back" aria-label="表紙に戻る">←</a>
      <h1 class="auth-title">はじめまして</h1>
      <p class="text-muted">まずは、あなたのことを教えてください。</p>

      <form id="signup-form" class="stack" novalidate>
        <fieldset class="role-select">
          <legend class="visually-hidden">どちらで使いますか</legend>
          <label class="role-option">
            <input type="radio" name="role" value="patient" checked />
            <span class="role-card">
              <strong>お薬を飲む本人として</strong>
              <span class="text-sm text-muted">服薬の記録をつけます</span>
            </span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="caregiver" />
            <span class="role-card">
              <strong>家族・介護者として</strong>
              <span class="text-sm text-muted">大切な人の服薬を見守ります</span>
            </span>
          </label>
        </fieldset>

        <div class="field">
          <label for="password">パスワード</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" placeholder="8文字以上" />
            <button type="button" class="password-toggle" id="password-toggle"
                  aria-label="パスワードを表示" aria-pressed="false">表示</button>
          </div>
          <span class="field-hint">8文字以上で設定してください。</span>
        </div>

        <div class="field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="example@mail.com" />
        </div>

        <button type="submit" class="btn btn-accent" id="submit-btn">登録する</button>
      </form>

      <p class="auth-switch">すでにアカウントをお持ちの方は <a href="login.html">ログイン</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');

    passwordToggle.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      passwordToggle.textContent = isHidden ? '隠す' : '表示';
      passwordToggle.setAttribute('aria-label', isHidden ? 'パスワードを隠す' : 'パスワードを表示');
      passwordToggle.setAttribute('aria-pressed', String(isHidden));
      passwordInput.focus();
    });


    const form = document.getElementById('signup-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {
        name: fd.get('name').trim(),
        email: fd.get('email').trim(),
        password: fd.get('password'),
        role: fd.get('role'),
      };

      submitBtn.disabled = true;
      submitBtn.textContent = '登録しています…';

      try {
        const result = await Api.signup(payload);
        if (result.session) {
          // メール確認なしの設定なら即ログイン状態にする
          Session.set(result.session, result.user, null);
          showToast('登録が完了しました。', 'success');
          setTimeout(() => (location.href = 'home.html'), 600);
        } else {
          showToast('登録が完了しました。確認メールをご確認のうえログインしてください。', 'success');
          setTimeout(() => (location.href = 'login.html'), 1200);
        }
      } catch (err) {
        handleApiError(err, '登録に失敗しました。');
        submitBtn.disabled = false;
        submitBtn.textContent = '登録する';
      }
    });
  </script>
</body>
</html>
