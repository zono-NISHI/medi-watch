<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2" />
<title>ログイン - 電子お薬手帳</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2C4A52" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <a href="index.html" class="auth-back" aria-label="表紙に戻る">←</a>
      <h1 class="auth-title">おかえりなさい</h1>
      <p class="text-muted">メールアドレスとパスワードでログインしてください。</p>

      <form id="login-form" class="stack" novalidate>
        <div class="field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="example@mail.com" />
        </div>

        <div class="field">
          <label for="password">パスワード</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="パスワード" />
            <button type="button" class="password-toggle" id="password-toggle"
                  aria-label="パスワードを表示" aria-pressed="false">表示</button>
          </div>
        </div>

        <button type="submit" class="btn btn-accent" id="submit-btn">ログインする</button>
      </form>

      <p class="auth-switch">アカウントをお持ちでない方は <a href="signup.html">新規登録</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');

    passwordToggle.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      passwordToggle.textContent = isHidden ? '隠す' : '表示';
      passwordToggle.setAttribute('aria-label', isHidden ? 'パスワードを隠す' : 'パスワードを表示');
      passwordToggle.setAttribute('aria-pressed', String(isHidden));
      passwordInput.focus();
    });

    
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = { email: fd.get('email').trim(), password: fd.get('password') };

      submitBtn.disabled = true;
      submitBtn.textContent = 'ログインしています…';

      try {
        const result = await Api.login(payload);
        Session.set(result.session, result.user, result.profile);
        showToast('ログインしました。', 'success');
        setTimeout(() => (location.href = 'home.html'), 400);
      } catch (err) {
        handleApiError(err, 'ログインに失敗しました。');
        submitBtn.disabled = false;
        submitBtn.textContent = 'ログインする';
      }
    });
  </script>
</body>
</html>
