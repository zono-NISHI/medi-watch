<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2" />
<title>見守り - 電子お薬手帳</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2C4A52" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/family.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-icon" aria-hidden="true">家</div>
      <div class="topbar-title" id="page-title">見守り</div>
    </header>

    <div id="family-sections" class="stack">

      <!-- ===== 見守る側：自分が見守っているご家族 ===== -->
      <section id="watching-section" class="stack" aria-labelledby="watching-heading">
        <h2 id="watching-heading" class="section-heading">あなたが見守っているご家族</h2>

        <div id="watching-list" class="stack stack--tight">
          <p class="text-muted">読み込み中…</p>
        </div>

        <details class="card card--warm fold" id="join-fold">
          <summary class="fold-summary">招待コードを入力して見守りを始める</summary>
          <p class="text-sm text-muted">ご家族の「見守り」画面に表示されている招待コードを入力してください。</p>
          <form id="join-form" class="stack stack--tight">
            <label class="sr-only" for="invite-code-input">招待コード</label>
            <input type="text" id="invite-code-input" placeholder="例：a1b2c3d4"
                   inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" required />
            <label class="text-sm" for="relation-input">あなたから見た続柄（任意）</label>
            <input type="text" id="relation-input" placeholder="例：母、父、祖母" maxlength="20" />
            <button type="submit" class="btn btn-accent">見守りを始める</button>
          </form>
        </details>
      </section>

      <!-- ===== 見守られる側：自分を見守っているご家族 ===== -->
      <section id="watchers-section" class="stack" aria-labelledby="watchers-heading">
        <h2 id="watchers-heading" class="section-heading">あなたを見守っているご家族</h2>

        <details class="card card--warm fold" id="invite-fold">
          <summary class="fold-summary">あなたの招待コード</summary>
          <p class="text-sm text-muted">このコードをご家族に伝えると、あなたのお薬の予定と服薬の記録を見守ってもらえます。</p>
          <div class="invite-code-box" id="invite-code-box" hidden></div>
          <button class="btn btn-outline" id="create-group-btn" hidden>招待コードを発行する</button>
          <button class="btn btn-ghost btn--sm" id="copy-code-btn" hidden>コードをコピーする</button>
        </details>

        <div id="watchers-list" class="stack stack--tight">
          <p class="text-muted">読み込み中…</p>
        </div>
      </section>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/alarm.js"></script>
  <script src="js/pages/family.js"></script>
</body>
</html>
