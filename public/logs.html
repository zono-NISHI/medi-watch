<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2" />
<title>服薬記録 - 電子お薬手帳</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2C4A52" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/home.css" />
<link rel="stylesheet" href="css/logs.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-icon" aria-hidden="true">記</div>
      <div class="topbar-title" id="page-title">服薬記録</div>
    </header>

    <!-- 表示する人の切り替え（見守っているご家族がいるときだけ表示） -->
    <nav id="view-switcher" class="view-switcher" aria-label="表示する人" hidden></nav>

    <section id="role-banner" aria-live="polite"></section>

    <!-- 付け忘れた服薬をあとから登録する（自分の記録を表示しているときだけ出す） -->
    <button class="btn btn-accent" id="add-log-btn" style="margin-bottom: var(--space-3);" hidden>＋ 服薬の記録を追加する</button>

    <div class="row" style="margin-bottom: var(--space-3);">
      <input type="date" id="date-filter" />
      <select id="status-filter">
        <option value="">すべて</option>
        <option value="taken">服薬済み</option>
        <option value="pending">未記録</option>
        <option value="skipped">スキップ</option>
      </select>
    </div>

    <section id="log-list" class="stack" aria-live="polite">
      <p class="text-muted">読み込み中…</p>
    </section>
  </main>

  <!-- 記録の状態を変える画面 -->
  <dialog id="status-modal" class="take-modal">
    <div class="take-modal-inner">
      <button class="modal-close" data-close aria-label="閉じる">×</button>
      <h2 id="status-modal-title">記録を編集する</h2>
      <p class="text-muted" id="status-modal-sub"></p>
      <div class="stack stack--tight">
        <button class="btn btn-success" data-status="taken">服薬済みにする</button>
        <button class="btn btn-outline" data-status="skipped">スキップにする</button>
        <button class="btn btn-ghost" data-status="pending" id="status-pending-btn">記録を取り消す</button>
      </div>
      <p class="text-sm text-muted" id="status-modal-note"></p>
    </div>
  </dialog>

  <!-- 服薬の記録を追加する画面 -->
  <dialog id="add-modal" class="take-modal">
    <form class="take-modal-inner stack" id="add-form" novalidate>
      <button type="button" class="modal-close" data-close aria-label="閉じる">×</button>
      <h2>服薬の記録を追加する</h2>
      <p class="text-muted">「飲んだ」を押し忘れたときなどに、あとから記録できます。</p>
      <div class="field">
        <label for="add-date">日付</label>
        <select id="add-date" required></select>
      </div>
      <div class="field">
        <label for="add-schedule">お薬と時刻</label>
        <select id="add-schedule" required></select>
      </div>
      <p class="text-sm text-muted" id="add-schedule-note" hidden></p>
      <div class="stack stack--tight">
        <button type="button" class="btn btn-success" data-status="taken">服薬済みとして記録する</button>
        <button type="button" class="btn btn-outline" data-status="skipped">スキップとして記録する</button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/viewTarget.js"></script>
  <script src="js/alarm.js"></script>
  <script src="js/pages/logs.js"></script>
</body>
</html>
