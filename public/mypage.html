<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2" />
<title>マイページ - 電子お薬手帳</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2C4A52" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/mypage.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-icon" aria-hidden="true">人</div>
      <div class="topbar-title">マイページ</div>
    </header>

    <section class="card stack" id="profile-card">
      <h2>プロフィール</h2>
      <form id="profile-form" class="stack">
        <div class="field">
          <label for="p-name">お名前</label>
          <input type="text" id="p-name" required />
        </div>
        <div class="field">
          <label for="p-phone">電話番号（任意）</label>
          <input type="tel" id="p-phone" placeholder="緊急連絡先など" />
        </div>
        <button type="submit" class="btn btn-accent">保存する</button>
      </form>
    </section>

    <!-- 使う機能（見守る／見守ってもらう）。どちらも外すと「自分のお薬の管理だけ」になる -->
    <section class="card" style="margin-top: var(--space-3);">
      <h2>使う機能</h2>
      <p class="text-sm text-muted">ご自分のお薬の記録は、いつでも使えます。ご家族とのつながり方を選んでください。</p>
      <form id="features-form" class="stack">
        <div>
          <label class="checkbox-row">
            <input type="checkbox" id="f-be-watched" />
            <strong>家族に見守ってもらう</strong>
          </label>
          <p class="text-sm text-muted" style="margin:0;">招待コードをご家族に伝えて、お薬を飲んだかどうかを見てもらいます。</p>
        </div>
        <div>
          <label class="checkbox-row">
            <input type="checkbox" id="f-watch" />
            <strong>家族を見守る</strong>
          </label>
          <p class="text-sm text-muted" style="margin:0;">ご家族の招待コードを入力して、ご家族の服薬を見守ります。</p>
        </div>
        <p id="f-summary" class="text-sm" style="margin:0;" aria-live="polite"></p>
        <button type="submit" class="btn btn-outline">使う機能を保存する</button>
      </form>
    </section>

    <section class="card card--warm" style="margin-top: var(--space-3);">
      <h2>通知設定</h2>
      <p class="text-sm text-muted">服薬リマインドや家族からのお知らせを受け取ります。</p>
      <button class="btn btn-outline" id="enable-notif-btn">プッシュ通知を有効にする</button>
      <button class="btn btn-outline" id="test-notif-btn" style="margin-top: var(--space-2);">テスト通知を送る</button>
      <button class="btn btn-outline" id="status-notif-btn" style="margin-top: var(--space-2);">通知の状態を確認する</button>
      <pre id="notif-status" class="text-sm" hidden style="white-space: pre-wrap; word-break: break-all; margin-top: var(--space-2);"></pre>
    </section>

    <button class="btn btn-danger-outline" id="logout-btn" style="margin-top: var(--space-4);">ログアウト</button>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/push.js"></script>
  <script src="js/alarm.js"></script>
  <script src="js/pages/mypage.js"></script>
</body>
</html>
