<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2" />
<title>電子お薬手帳 - 家族と見守る、毎日のお薬</title>
<meta name="description" content="服薬の記録を家族とリアルタイムに共有できる電子お薬手帳。QRコード登録、服薬リマインド通知、見守り映像記録に対応。" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2C4A52" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/cover.css" />
</head>
<body class="cover-body">

  <main class="cover">
    <div class="cover-paper">
      <div class="cover-emblem" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="2.5"/>
          <path d="M32 56c0-13 8-22 18-22s18 9 18 22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="50" cy="38" r="6" stroke="currentColor" stroke-width="2.5"/>
          <path d="M30 68h40" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>

      <p class="cover-eyebrow">家族と見守る、毎日のお薬</p>
      <h1 class="cover-title">電子<br />お薬手帳</h1>
      <p class="cover-sub">飲んだ記録が、そっと家族に届く。<br />離れていても、いつもの安心を。</p>

      <div class="cover-actions">
        <a href="signup.html" class="btn btn-accent">はじめて使う方はこちら</a>
        <a href="login.html" class="btn btn-outline">ログインする</a>
      </div>
    </div>

    <section class="cover-features" aria-label="主な機能">
      <div class="feature-card">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </div>
        <h2>家族へリアルタイム通知</h2>
        <p>服薬の状況を、別の端末を使うご家族・介護者にその場で通知します。</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </div>
        <h2>音声案内と映像記録</h2>
        <p>服薬の時間に音声でお知らせし、カメラで服薬の様子を記録。家族はいつでも確認できます。</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM19 14v3M14 19h3"/></svg>
        </div>
        <h2>QRコードでかんたん登録</h2>
        <p>薬局でもらうQRコードを読み取るだけ。手入力でも、もちろん登録できます。</p>
      </div>
    </section>

    <p class="cover-footnote">高齢の方にもわかりやすい、大きな文字とシンプルな操作で設計しています。</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // すでにログイン済みならホームへ
    if (Session.isLoggedIn()) {
      location.href = 'home.html';
    }
  </script>
</body>
</html>
