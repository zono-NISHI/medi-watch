<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2" />
<title>服薬記録 - 電子お薬手帳</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2C4A52" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/home.css" />
<link rel="stylesheet" href="css/logs.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-icon" aria-hidden="true">記</div>
      <div class="topbar-title">服薬記録</div>
    </header>

    <div class="row" style="margin-bottom: var(--space-3);">
      <input type="date" id="date-filter" />
      <select id="status-filter">
        <option value="">すべて</option>
        <option value="taken">服薬済み</option>
        <option value="pending">未記録</option>
        <option value="skipped">スキップ</option>
      </select>
    </div>

    <section id="log-list" class="stack" aria-live="polite">
      <p class="text-muted">読み込み中…</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/logs.js"></script>
</body>
</html>
